name: Offline tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/security/forbid_sensitive_files.py --all
      - run: python scripts/security/scan_mcp_config.py
      - run: python -m pytest tests/ -q

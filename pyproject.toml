[project]
name = "marketplaces-mcp-ru-readonly"
version = "0.1.0"
description = "Read-only Codex MCP gateway for Wildberries and Ozon seller APIs"
keywords = ["mcp", "model-context-protocol", "wildberries", "ozon", "seller-api", "marketplace", "ecommerce", "read-only", "codex"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds on purpose: mcp 2.x renamed FastMCP (mcp.server.fastmcp is
    # gone) and would break every fresh `uvx` / pip install; httpx 1.x and
    # pyyaml 7 are held the same way. serve.py pins the identical set.
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
marketplaces-mcp-readonly = "readonly_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.5",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "wb_mcp", "ozon_mcp", "ozon_perf_mcp", "readonly_mcp"]

[tool.setuptools.package-data]
core = ["entities.yaml"]
wb_mcp = ["endpoints.yaml", "workflows.yaml"]
# perf_endpoints.yaml lives in ozon_mcp because ozon_perf_mcp/server.py loads
# it from ../ozon_mcp/perf_endpoints.yaml — it MUST ship inside ozon_mcp.
ozon_mcp = ["endpoints.yaml", "perf_endpoints.yaml", "workflows.yaml"]
ozon_perf_mcp = ["workflows.yaml"]
